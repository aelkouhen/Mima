server:
  port: 9000
  servlet:
    context-path: /auth

spring:
  application:
    name: mima
  datasource:
    url: jdbc:mysql://localhost:3306/db_mima?useSSL=false
    username: mima
    password: password-mima
    driver-class-name: com.mysql.cj.jdbc.Driver
    platform: mysql
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    hibernate:
      naming-strategy: org.hibernate.cfg.ImprovedNamingStrategy
      ddl-auto: create
    show-sql: true
security:
  oauth2:
    resource:
      token-type: Bearer
      id: ADMIN_RESOURCE

logging:
  level:
    org.hibernate : ERROR

swagger:
  api:
    version: 1.0

eureka:
  instance:
    hostname: localhost
    port: 8000
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${eureka.instance.port}/eureka/
    healthcheck:
      enabled: true
  server:
    wait-time-in-ms-when-sync-empty: 3000


check-user-scopes: true